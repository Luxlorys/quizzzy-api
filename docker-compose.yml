# Default: Postgres and Redis run in Docker; the app runs on the host with
# `npm run dev` (fast reloads, no container rebuild, migrations point at
# localhost with no host switching).
#
# `docker compose --profile full up` additionally builds and runs the API in a
# container, applying migrations first.

services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: app
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
            interval: 5s
            timeout: 3s
            retries: 10

    redis:
        image: redis:8-alpine
        command: ["redis-server", "--save", "", "--appendonly", "no"]
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

    api:
        profiles: ["full"]
        build:
            context: .
            target: build
        command: sh -c "npx prisma migrate deploy && node dist/server.js"
        environment:
            NODE_ENV: production
            DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
            REDIS_URL: redis://redis:6379
            PORT: 3000
        ports:
            - "3000:3000"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

volumes:
    postgres-data:
